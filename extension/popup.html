<meta charset="utf-8">
<title>Meerkat Live</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 292px; margin: 0; padding: 14px;
    font: 13px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: Canvas; color: CanvasText;
  }
  h1 { font-size: 13px; margin: 0 0 10px; letter-spacing: .02em; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 9px 0; }
  label { font-size: 12px; }
  select, input[type=number], input[type=text] {
    font: inherit; padding: 3px 6px; border-radius: 6px;
    border: 1px solid rgba(128,128,128,.45); background: Field; color: FieldText;
  }
  input[type=number] { width: 56px; }
  input[type=text] { width: 160px; }
  textarea {
    width: 100%; box-sizing: border-box; height: 96px; font: 11px/1.4 ui-monospace, monospace;
    border-radius: 6px; border: 1px solid rgba(128,128,128,.45); padding: 6px;
    background: Field; color: FieldText; resize: vertical;
  }
  .status { margin: 10px 0 4px; padding: 8px 10px; border-radius: 8px; background: rgba(128,128,128,.14); font-size: 12px; }
  .muted { opacity: .65; font-size: 11px; }
  hr { border: 0; border-top: 1px solid rgba(128,128,128,.28); margin: 12px 0 8px; }
  button { font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(128,128,128,.45); background: transparent; color: inherit; cursor: pointer; }
  button:hover { background: rgba(128,128,128,.16); }
</style>

<h1>Meerkat Live</h1>
<div class="status" id="status">Checking Meerkat…</div>

<div class="row"><label for="enabled">Show overlay</label><input type="checkbox" id="enabled"></div>
<div class="row"><label for="corner">Corner</label>
  <select id="corner">
    <option value="bottom-right">Bottom right</option>
    <option value="top-right">Top right</option>
    <option value="bottom-left">Bottom left</option>
    <option value="top-left">Top left</option>
  </select>
</div>
<div class="row"><label for="maxCards">Max cards</label><input type="number" id="maxCards" min="1" max="13"></div>
<div class="row"><label for="opacity">Resting opacity</label><input type="number" id="opacity" min="0.2" max="1" step="0.05"></div>
<div class="row"><label for="meerkatUrl">Meerkat URL</label><input type="text" id="meerkatUrl"></div>

<hr>
<label for="blocklist">Hidden on these domains <span class="muted">(one per line, subdomains included)</span></label>
<textarea id="blocklist" spellcheck="false"></textarea>
<div class="row"><span class="muted">Saves as you type</span><button id="open">Open Meerkat</button></div>

<script type="module" src="popup.js"></script>
